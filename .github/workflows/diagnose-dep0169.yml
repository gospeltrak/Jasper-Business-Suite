name: Preview Node DEP0169 diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preview-request:
    runs-on: ubuntu-latest
    steps:
      - name: Exercise public tenant resolver on tracing preview
        shell: bash
        run: |
          set -euo pipefail
          url='https://jasper-business-suite-git-fix-node24-url-54c2df-pix-01-projects.vercel.app/api/tenant/resolve?host=orvix.africa'
          code='000'
          for attempt in $(seq 1 15); do
            code=$(curl --connect-timeout 10 --max-time 35 -sS -o /tmp/resolve-body.txt -w '%{http_code}' "$url" || true)
            printf 'Preview HTTP attempt %s: status %s\n' "$attempt" "$code"
            if [ "$code" = 200 ]; then break; fi
            sleep 8
          done
          if [ "$code" != 200 ]; then
            echo 'The preview HTTP endpoint is unavailable or protected.'
            exit 1
          fi
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('/tmp/resolve-body.txt','utf8'));if(!v.kind)process.exit(1);console.log('Public response kind:',v.kind)"
