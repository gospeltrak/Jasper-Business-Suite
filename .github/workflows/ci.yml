name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Verify production deployment build
        run: npm run build

  postgres-inventory-shadow:
    name: PostgreSQL 17 JSON normalization / tenant RLS contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: orvix_ci_synthetic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orvix_ci_synthetic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: orvix_ci_synthetic
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Execute typed JSON inventory staging scripts on disposable synthetic data
        run: |
          psql -v ON_ERROR_STOP=1 \
            -f scripts/sql/ci_inventory_synthetic_fixture.sql \
            -c "SET app.orvix_inventory_backfill_permission = 'STAGING_ONLY_RESTORE_TESTED';" \
            -f scripts/sql/staging_backfill_product_inventory_settings.sql \
            -f scripts/sql/staging_extend_and_backfill_inventory_details.sql \
            -f scripts/sql/staging_backfill_historical_inventory_batches.sql \
            -f scripts/sql/staging_backfill_universal_product_units.sql \
            -f scripts/sql/ci_inventory_synthetic_assertions.sql
