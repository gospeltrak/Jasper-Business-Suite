name: Native Android QA (no production release)

on:
  workflow_dispatch:
  # Build a fresh internal QA APK when the native development branch changes.
  push:
    branches: [feature/orvix-native-offline-v1, feature/scanner-printer-native-58-80, qa/orvix-android-pr39-20261101, qa/orvix-android-pr39-pos-cart-focus-20261101, qa/orvix-android-pr42-delivery-split-20261101, qa/orvix-android-cart-login-20261101]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/migrations/**'
      - '.github/workflows/native-android-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'scripts/verify-native-*.mjs'
      - '.github/workflows/native-android-qa.yml'

permissions:
  contents: read

concurrency:
  group: native-android-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # QA-only integration: build the current production PR39 changes atop
      # the existing Android native shell, without touching main or Pro.
      - name: Integrate released production frontend into Android QA workspace
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git -c user.name='Orvix Android QA' -c user.email='orvix-android-qa@users.noreply.github.com' merge --no-commit --no-ff -X theirs origin/main
          git diff --name-only --diff-filter=U | tee /tmp/orvix-merge-unresolved.txt
          test ! -s /tmp/orvix-merge-unresolved.txt
          # Keep Android-specific native camera permission recovery that was
          # dropped by a production-wins conflict resolution in scanner UI.
          git show origin/feature/scanner-printer-native-58-80:src/shared/components/DashboardBarcodeScanner.tsx > src/shared/components/DashboardBarcodeScanner.tsx
          grep -q 'scripts/ui-saving-performance.test.ts' <(git ls-files --cached)
          grep -q 'src/modules/reports/components/DeliveryTreasuryPanel.tsx' <(git ls-files --cached)
          grep -q 'src/modules/settings/DashboardScannerPrinterSettings.tsx' <(git ls-files --cached)

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Integrate native UI types without changing production
        run: node scripts/qa-integrate-android-pr39.mjs

      - name: Integrate PR42 product-only checkout and cart focus, preserving Android printer
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin fix/pos-cart-discount-delivery-focus-20261101
          # New production POS is the source of truth for checkout, rendering,
          # and camera lazy load; inject only Android hardware integrations.
          node scripts/qa-overlay-native-pos-printer.mjs
          # Read stable, fully tested web files that have no native-specific code.
          for file in index.html src/shared/components/CachedImage.tsx src/shared/utils/lazyWithReload.ts src/shared/components/AppErrorBoundary.tsx src/shared/components/DashboardScreenErrorBoundary.tsx scripts/deployment-contract.test.ts; do
            git show origin/fix/pos-cart-discount-delivery-focus-20261101:"$file" > "$file"
          done
          # New production already includes the throttled workspace recovery.
          # The native adapter is only needed when its hook is still old.
          if ! grep -q 'MIN_RECOVERY_REFRESH_MS' src/components/Dashboard.tsx; then
            node scripts/qa-keep-active-forms-stable.mjs
          fi
          grep -q 'MIN_RECOVERY_REFRESH_MS' src/components/Dashboard.tsx
          grep -q 'inFlightLoads' src/shared/components/CachedImage.tsx
          ! grep -q 'window.location.reload()' index.html
          grep -q 'loginEmailInputRef' src/modules/auth/LoginPage.tsx
          grep -q 'pos-checkout-total-compact' src/index.css
          grep -q 'const subtotal = cart.reduce' src/modules/pos/DashboardPOS.tsx
          grep -q 'const displayedChannelPrice = getChannelPrice(item.product)' src/modules/pos/DashboardPOS.tsx
          grep -q 'const productCards = useMemo' src/modules/pos/DashboardPOS.tsx
          grep -q 'product.defaultPricePerBaseUnit,' src/modules/sales/utils/fractionSale.ts
          git show origin/fix/pos-cart-discount-delivery-focus-20261101:scripts/sales-delivery-accounting.test.ts > scripts/sales-delivery-accounting.test.ts
          git show origin/fix/pos-cart-discount-delivery-focus-20261101:scripts/ui-saving-performance.test.ts > scripts/ui-saving-performance.test.ts
          git show origin/fix/pos-cart-discount-delivery-focus-20261101:scripts/security-hardening-contract.test.ts > scripts/security-hardening-contract.test.ts
          grep -q 'const productCheckoutTotal = useMemo' src/modules/pos/DashboardPOS.tsx
          grep -q 'data-testid="pos-checkout-delivery-summary"' src/modules/pos/DashboardPOS.tsx
          grep -q 'sendNativeReceipt' src/modules/pos/DashboardPOS.tsx

      - name: Install locked dependencies
        run: npm ci

      - name: Verify PR39 production contracts plus native UI safety
        run: |
          # The old byte-for-byte UI freeze cannot evaluate an integrated merge
          # with newer production POS/Delivery UI. Keep its self-tests, then
          # enforce the production PR39 contracts and native contract checks.
          node scripts/verify-native-ui-freeze.mjs --self-test
          npm run test:deploy
          node --input-type=module -e "
            import fs from 'node:fs';
            const read = p => fs.readFileSync(p, 'utf8');
            const rules = [
              ['scripts/ui-saving-performance.test.ts', /Confirm Payment|processing|translate/],
              ['src/modules/reports/components/DeliveryTreasuryPanel.tsx', /delivery/i],
              ['src/modules/settings/DashboardScannerPrinterSettings.tsx', /Printer|Scanner/],
              ['src/modules/pos/DashboardPOS.tsx', /sendNativeReceipt/],
              ['src/shared/contexts/JasperNotificationContext.tsx', /refreshInbox/],
            ];
            for (const [path, pattern] of rules) {
              if (!pattern.test(read(path))) throw new Error('Missing integrated production/native feature: ' + path);
            }
          "

      - name: Native isolation and security contracts
        run: npm run native:verify

      - name: Scanner, Printer & Product Unit Pricing tests
        run: npx vitest run src/shared/utils/posDevices.test.ts src/modules/sales/utils/fractionSale.test.ts

      - name: Verify PR42 split checkout and input focus regression
        run: npx tsx --test scripts/sales-delivery-accounting.test.ts scripts/ui-saving-performance.test.ts

      - name: Validate TypeScript
        run: npm run lint

      - name: Build packaged native web assets
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          test -n "$VITE_TURNSTILE_SITE_KEY" || { echo 'ERROR: set GitHub Actions variable VITE_TURNSTILE_SITE_KEY (Cloudflare public site key) before building native QA'; exit 1; }
          npm run native:build:web

      - name: Create Android shell and sync packaged assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Install Android camera permission recovery
        run: node scripts/setup-native-android-camera.mjs

      - name: Install native Bluetooth printer support
        run: node scripts/setup-native-android-printer.mjs

      # Stable *internal QA only* signing, not for release/Play Store.
      # Cache the explicit workspace file. The prior ~/.android path did not
      # exist at cache-save time, silently changing signers between builds.
      - name: Reuse Android QA debug signing key across builds
        uses: actions/cache@v4
        with:
          path: android/app/orvix-qa-debug.keystore
          key: orvix-android-qa-debug-signing-${{ runner.os }}-${{ github.ref }}-v2

      - name: Initialize Android QA debug signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app "$HOME/.android"
          if [ ! -f android/app/orvix-qa-debug.keystore ]; then
            keytool -genkeypair -v -keystore android/app/orvix-qa-debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi
          cp android/app/orvix-qa-debug.keystore "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"

      - name: Compile signed QA/debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Keep debug APK as internal QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: orvix-android-debug-qa-only
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
