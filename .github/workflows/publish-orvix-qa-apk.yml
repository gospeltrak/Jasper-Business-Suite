name: Publish Orvix POS Faster Cart Android QA APK

on:
  push:
    branches: [qa/publish-orvix-pos-speed-apk-20261101]
    paths:
      - '.github/workflows/publish-orvix-qa-apk.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify QA run and download built Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          result="$(gh api repos/"$GH_REPO"/actions/runs/41338437627 --jq '.conclusion')"
          test "$result" = success
          mkdir -p orvix-apk
          gh run download 41338437627 --name orvix-android-debug-qa-only --dir orvix-apk --repo "$GH_REPO"
          test -s orvix-apk/app-debug.apk
          unzip -t orvix-apk/app-debug.apk >/dev/null
          sha256sum orvix-apk/app-debug.apk
          mv orvix-apk/app-debug.apk orvix-apk/Orvix-POS-Speed-Cart-Fix-Android-QA.apk
      - name: Publish browser-linkable QA APK (not production)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create orvix-android-qa-pos-speed-20261101 \
            orvix-apk/Orvix-POS-Speed-Cart-Fix-Android-QA.apk \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title 'Orvix Android QA — Faster Add-to-Cart (2026-11-01)' \
            --notes 'QA/debug only: memoize product grid so adding cart products does not reconcile all catalog cards/images; includes product pricing and cart total improvements, delivery split, sign-in focus, native scanner and printer. Built successfully in native Android QA workflow run 41338437627. Physical phone performance still needs confirmation. No tenant data changed or production deployment.' \
            --prerelease
