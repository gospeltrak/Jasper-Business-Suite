name: Publish Orvix Production-Synced Android QA APK

on:
  push:
    branches: [qa/publish-orvix-production-sync-20261101]
    paths:
      - '.github/workflows/publish-orvix-qa-apk.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify QA run and download built Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          result=""
          for i in $(seq 1 60); do
            result="$(gh api repos/"$GH_REPO"/actions/runs/41342858266 --jq '.conclusion // ""')"
            if [ "$result" = success ]; then break; fi
            if [ -n "$result" ]; then echo "Android build failed: $result"; exit 1; fi
            sleep 10
          done
          test "$result" = success
          mkdir -p orvix-apk
          gh run download 41342858266 --name orvix-android-debug-qa-only --dir orvix-apk --repo "$GH_REPO"
          test -s orvix-apk/app-debug.apk
          unzip -t orvix-apk/app-debug.apk >/dev/null
          sha256sum orvix-apk/app-debug.apk
          mv orvix-apk/app-debug.apk orvix-apk/Orvix-Production-Synced-Fast-POS-Android-QA.apk
      - name: Publish browser-linkable QA APK (not production)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create orvix-android-qa-production-sync-20261101 \
            orvix-apk/Orvix-Production-Synced-Fast-POS-Android-QA.apk \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title 'Orvix Android QA — Production Sync & Fast POS (2026-11-01)' \
            --notes 'QA/debug Android APK synchronized with live Orvix Production commit d05bd8a. Includes verified browser POS add-to-total timing, memoized product grid, separate delivery payments, keyboard focus, scanner and 58/80mm Bluetooth printer. Android build run 41342858266. Not a Play Store production release. Test device before using real payment data. No tenant data modifications.' \
            --prerelease
