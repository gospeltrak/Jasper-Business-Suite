name: Publish Orvix Android QA with no automatic reloads

on:
  push:
    branches: [qa/publish-orvix-no-auto-reload-apk-20261101]
    paths:
      - '.github/workflows/publish-orvix-qa-apk.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate successful QA run and download exact APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          result="$(gh api repos/"$GH_REPO"/actions/runs/41339420457 --jq '.conclusion')"
          test "$result" = success
          mkdir -p orvix-apk
          gh run download 41339420457 --name orvix-android-debug-qa-only --dir orvix-apk --repo "$GH_REPO"
          test -s orvix-apk/app-debug.apk
          unzip -t orvix-apk/app-debug.apk >/dev/null
          sha256sum orvix-apk/app-debug.apk
          mv orvix-apk/app-debug.apk orvix-apk/Orvix-Fast-POS-No-Auto-Reload-Android-QA.apk
      - name: Publish downloadable QA-only APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create orvix-android-qa-fast-no-reload-20261101 \
            orvix-apk/Orvix-Fast-POS-No-Auto-Reload-Android-QA.apk \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title 'Orvix Android QA — Fast POS, No Forced Reloads' \
            --notes 'Android QA/debug APK. React product grid memoization, immediate cart totals and checkout delivery split, cached product images and coalesced image loads, no forced page reload on app/PWA update or lazy screen error, throttled workspace focus refresh; native printer/scanner preserved. Native build run 41339420457 succeeded. Physical-phone performance testing still required before production; no customer data or production deployment modified.' \
            --prerelease
