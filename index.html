    <!-- interactive-widget=resizes-content: makes the browser itself shrink the
         actual layout viewport (so 100dvh / --app-height reflow instantly) when
         the on-screen keyboard opens, instead of only shrinking the "visual"
         viewport and leaving layout to catch up via JS on a delay. That JS-only
         catch-up (still kept below in main.tsx as a fallback for older browsers
         that ignore this directive) has a timing gap right as the keyboard
         opens/closes where the fixed mobile shell (#dashboard-scaffold) is
         still sized for the pre-keyboard height while the visible viewport is
         already shorter, exposing an unpainted blank strip. Supported in
         Chrome/Android 108+ and Safari/iOS 16.4+; older browsers simply ignore
         the unrecognized token and keep relying on the JS fallback. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
    <!-- Patch window.fetch writable to prevent TypeError when other scripts/extensions try to mock/assign it in read-only iframe environments -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          
          var descriptor = {
            configurable: true,
            enumerable: true,
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            }
          };

          // Try patching window itself
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e1) {
            console.warn("[System] Failed to patch fetch on window directly:", e1);
          }

          // Try patching Window.prototype
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (e2) {
              console.warn("[System] Failed to patch fetch on Window.prototype:", e2);
            }
          }

          // Try patching window.__proto__
          if (window.__proto__) {
            try {
              Object.defineProperty(window.__proto__, 'fetch', descriptor);
            } catch (e3) {
              console.warn("[System] Failed to patch fetch on window.__proto__:", e3);
            }
          }
        } catch (e) {
          console.warn("[System] General fetch patch failed:", e);
        }
      })();
    </script>

    <link rel="manifest" href="/manifest.json" />

    <script>
      (function() {
        function setViewportVars() {
          var vv = window.visualViewport;
          var height = vv ? vv.height : window.innerHeight;
          var width = vv ? vv.width : window.innerWidth;
          var bottomInset = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
          document.documentElement.style.setProperty('--app-height', height + 'px');
          document.documentElement.style.setProperty('--app-width', width + 'px');
          document.documentElement.style.setProperty('--browser-bottom-inset', bottomInset + 'px');
        }

        setViewportVars();
        window.addEventListener('resize', setViewportVars, { passive: true });
        window.addEventListener('orientationchange', function() {
          window.setTimeout(setViewportVars, 250);
        }, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setViewportVars, { passive: true });
          window.visualViewport.addEventListener('scroll', setViewportVars, { passive: true });
        }
      })();
    </script>

    <style>
      /* ── NATIVE APP STABILITY — no hover transforms, no bounce, no shake ── */

      /* Lock entire app from rubber-band scrolling on iOS */
      html, body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        overflow: hidden;
        width: 100%;
        height: 100%;
        /* NOTE: position:fixed removed — it causes iOS white screen when keyboard opens.
           Scroll lock is achieved via overflow:hidden + overscroll-behavior:none on root. */
        background: #f5f6fa;
        touch-action: pan-y;
      }
      #root {
        width: 100%;
        height: var(--app-height, 100dvh);
        overflow: hidden;
        position: relative;
        background: #f5f6fa;
      }

      /* ── iOS INPUT WHITE SCREEN FIX ── */
      /* iOS renders native chrome (default white fill + system focus ring) over
         inputs unless native appearance is disabled. Disabling appearance is
         enough on its own — an input keeps whatever background/text color its
         own component classes (light or dark mode) already gave it through
         focus. Do NOT add `background-color: inherit` here: `inherit` copies
         the immediate parent's own background-color, and most input wrappers
         in this app (plain positioning <div>/<label> elements) have no
         background set at all, so on focus the input's real background gets
         thrown away and replaced by whatever happens to be behind it —
         frequently transparent/white, which in dark mode paints a white box
         behind light-colored focused text and makes it unreadable. This bit
         everyone, everywhere: every search box, combobox, and the Lucy AI
         chat input all render through plain <input>/<textarea> elements. */
      input, textarea, select {
        -webkit-appearance: none;
        appearance: none;
      }
      input:focus, textarea:focus, select:focus {
        outline: none;
      }
      /* Safari autofill yellow/white background fix — themed per color scheme
         so a browser-flagged "autofill-eligible" field (name/phone/search
         inputs are commonly flagged even while the user is just typing) does
         not force a hardcoded white box behind dark-mode text. */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      textarea:-webkit-autofill,
      select:-webkit-autofill {
        -webkit-box-shadow: 0 0 0px 1000px #ffffff inset;
        box-shadow: 0 0 0px 1000px #ffffff inset;
        -webkit-text-fill-color: #1e293b;
        caret-color: #1e293b;
        transition: background-color 5000s ease-in-out 0s;
      }
      @media (prefers-color-scheme: dark) {
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        textarea:-webkit-autofill,
        select:-webkit-autofill {
          -webkit-box-shadow: 0 0 0px 1000px #1e293b inset;
          box-shadow: 0 0 0px 1000px #1e293b inset;
          -webkit-text-fill-color: #f1f5f9;
          caret-color: #f1f5f9;
        }
      }
      .dark input:-webkit-autofill,
      .dark input:-webkit-autofill:hover,
      .dark input:-webkit-autofill:focus,
      .dark textarea:-webkit-autofill,
      .dark select:-webkit-autofill {
        -webkit-box-shadow: 0 0 0px 1000px #1e293b inset;
        box-shadow: 0 0 0px 1000px #1e293b inset;
        -webkit-text-fill-color: #f1f5f9;
        caret-color: #f1f5f9;
      }

      /* Buttons — only opacity on active, NO hover transform */
      button, a[role="button"], input[type="submit"] {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition: background-color 150ms ease, opacity 150ms ease !important;
        transform: none !important;
      }
      button:active, a[role="button"]:active, input[type="submit"]:active {
        opacity: 0.75;
      }

      /* Nav buttons — absolutely no movement */
      nav a, nav button, header a {
        transform: none !important;
        transition: color 120ms ease, background-color 120ms ease !important;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        text-decoration: none !important;
      }
      nav a::after, nav button::after, header a::after { display: none !important; }

      /* Cards — no hover lift */
      .bg-white.rounded-xl, .bg-white.rounded-2xl,
      .bg-slate-900.rounded-xl, .bg-slate-900.rounded-2xl,
      .bg-slate-950.rounded-xl {
        transform: none !important;
        transition: box-shadow 150ms ease !important;
      }

      /* Inputs — no scale on focus, no zoom on iOS */
      input[type="text"], input[type="email"], input[type="password"],
      input[type="number"], select, textarea {
        transform: none !important;
        transition: border-color 150ms ease, box-shadow 150ms ease !important;
        -webkit-appearance: none;
        font-size: 16px; /* prevent iOS auto-zoom on focus */
      }

      /* Floating AI button — no bouncing animation */
      #jasper-ai-floating-trigger {
        animation: none !important;
        transform: none !important;
        transition: opacity 150ms ease !important;
      }

      /* Disable reveal-on-scroll entirely — causes constant reflow */
      .reveal-on-scroll {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }

      /* ── NATIVE APP: no browser-feel touches ── */
      /* No text selection on UI controls */
      button, a, label, nav, header, [role="button"], [role="tab"] {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      /* Allow selection only in content areas */
      p, span, h1, h2, h3, h4, input, textarea {
        -webkit-user-select: text;
        user-select: text;
      }

      /* Safe area insets — ensure nothing hides under notch or home indicator */
      .pb-safe   { padding-bottom: env(safe-area-inset-bottom, 16px); }
      .pt-safe   { padding-top:    env(safe-area-inset-top, 0px); }

      /* Prevent double-tap zoom on iOS */
      * { touch-action: manipulation; }
      /* Re-allow pan on scrollable areas */
      .overflow-y-auto, .overflow-y-scroll,
      [data-scroll="true"] { touch-action: pan-y; }
    </style>
  </head>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        var jasperRefreshingForServiceWorker = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (jasperRefreshingForServiceWorker) return;
          jasperRefreshingForServiceWorker = true;
          window.location.reload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then((registration) => {
              console.log('Orvix PWA Service Worker registered securely with scope:', registration.scope);
              registration.update().catch((error) => {
                console.warn('Service Worker update check failed:', error);
              });
              window.setInterval(() => {
                registration.update().catch((error) => {
                  console.warn('Service Worker periodic update check failed:', error);
                });
              }, 60000);
            })
            .catch((error) => {
              console.error('Service Worker registration failed:', error);
            });
        });
      }
    </script>
