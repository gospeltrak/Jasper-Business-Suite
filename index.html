    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <!-- Patch window.fetch writable to prevent TypeError when other scripts/extensions try to mock/assign it in read-only iframe environments -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          
          var descriptor = {
            configurable: true,
            enumerable: true,
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            }
          };

          // Try patching window itself
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e1) {
            console.warn("[System] Failed to patch fetch on window directly:", e1);
          }

          // Try patching Window.prototype
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (e2) {
              console.warn("[System] Failed to patch fetch on Window.prototype:", e2);
            }
          }

          // Try patching window.__proto__
          if (window.__proto__) {
            try {
              Object.defineProperty(window.__proto__, 'fetch', descriptor);
            } catch (e3) {
              console.warn("[System] Failed to patch fetch on window.__proto__:", e3);
            }
          }
        } catch (e) {
          console.warn("[System] General fetch patch failed:", e);
        }
      })();
    </script>

    <script>
      (function() {
        function setViewportVars() {
          var vv = window.visualViewport;
          var height = vv ? vv.height : window.innerHeight;
          var width = vv ? vv.width : window.innerWidth;
          var bottomInset = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
          document.documentElement.style.setProperty('--app-height', height + 'px');
          document.documentElement.style.setProperty('--app-width', width + 'px');
          document.documentElement.style.setProperty('--browser-bottom-inset', bottomInset + 'px');
        }

        setViewportVars();
        window.addEventListener('resize', setViewportVars, { passive: true });
        window.addEventListener('orientationchange', function() {
          window.setTimeout(setViewportVars, 250);
        }, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setViewportVars, { passive: true });
          window.visualViewport.addEventListener('scroll', setViewportVars, { passive: true });
        }
      })();
    </script>
    
    <!-- Google Identity Services client for real Google login -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <title>Ndiva Suite</title>
    <style>
      /* ── NATIVE APP STABILITY — no hover transforms, no bounce, no shake ── */

      /* Lock entire app from rubber-band scrolling on iOS */
      html, body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        overflow: hidden;
        position: fixed;
        width: 100%;
        height: 100%;
        touch-action: pan-y;
      }
      #root {
        width: 100%;
        height: var(--app-height, 100dvh);
        overflow: hidden;
        position: relative;
      }

      /* Buttons — only opacity on active, NO hover transform */
      button, a[role="button"], input[type="submit"] {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition: background-color 150ms ease, opacity 150ms ease !important;
        transform: none !important;
      }
      button:active, a[role="button"]:active, input[type="submit"]:active {
        opacity: 0.75;
      }

      /* Nav buttons — absolutely no movement */
      nav a, nav button, header a {
        transform: none !important;
        transition: color 120ms ease, background-color 120ms ease !important;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        text-decoration: none !important;
      }
      nav a::after, nav button::after, header a::after { display: none !important; }

      /* Cards — no hover lift */
      .bg-white.rounded-xl, .bg-white.rounded-2xl,
      .bg-slate-900.rounded-xl, .bg-slate-900.rounded-2xl,
      .bg-slate-950.rounded-xl {
        transform: none !important;
        transition: box-shadow 150ms ease !important;
      }

      /* Inputs — no scale on focus, no zoom on iOS */
      input[type="text"], input[type="email"], input[type="password"],
      input[type="number"], select, textarea {
        transform: none !important;
        transition: border-color 150ms ease, box-shadow 150ms ease !important;
        -webkit-appearance: none;
        font-size: 16px; /* prevent iOS auto-zoom on focus */
      }

      /* Floating AI button — no bouncing animation */
      #jasper-ai-floating-trigger {
        animation: none !important;
        transform: none !important;
        transition: opacity 150ms ease !important;
      }

      /* Disable reveal-on-scroll entirely — causes constant reflow */
      .reveal-on-scroll {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        var jasperRefreshingForServiceWorker = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (jasperRefreshingForServiceWorker || sessionStorage.getItem('jasper_sw_refresh_v1')) return;
          jasperRefreshingForServiceWorker = true;
          sessionStorage.setItem('jasper_sw_refresh_v1', '1');
          window.location.reload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Ndiva PWA Service Worker registered securely with scope:', registration.scope);
              registration.update().catch((error) => {
                console.warn('Service Worker update check failed:', error);
              });
            })
            .catch((error) => {
              console.error('Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
