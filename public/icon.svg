<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sunburst" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="1" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#sunburst)" />
  
  <!-- Sunburst rays -->
  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="15">
    <line x1="256" y1="256" x2="256" y2="0" />
    <line x1="256" y1="256" x2="256" y2="512" />
    <line x1="256" y1="256" x2="0" y2="256" />
    <line x1="256" y1="256" x2="512" y2="256" />
    <line x1="256" y1="256" x2="0" y2="0" />
    <line x1="256" y1="256" x2="512" y2="512" />
    <line x1="256" y1="256" x2="0" y2="512" />
    <line x1="256" y1="256" x2="512" y2="0" />
  </g>

  <!-- Abstract Monogram (aB) -->
  <g fill="#ffffff" filter="url(#shadow)" transform="translate(140, 160)">
    <!-- Top left 'a' or reverse 'G' -->
    <path d="M100,0 H20 V40 H100 V100 H0 V140 H140 V0 Z M60,40 H100 V60 H60 Z" />
    <!-- Bottom right 'B' -->
    <path d="M140,192 H220 V152 H140 V92 H240 V232 H100 V192 Z M180,152 H140 V132 H180 Z" />
  </g>
</svg>
